name: Gerar Mod Completo (Itens e Receitas)

on:
  workflow_dispatch: # Permite rodar manualmente na aba Actions do GitHub

jobs:
  gerar-mod:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite salvar os arquivos gerados direto no repositório
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar gerador unificado do mod dentro do Behavior Pack
        working-directory: ./BP   # Direciona o script para dentro da pasta BP
        run: python gerar_mod.py

      - name: Commitar e enviar arquivos com segurança nativa do Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Adiciona apenas os arquivos dentro da pasta BP
          git add BP/
          
          # Realiza o commit (se não houver mudanças, apenas avisa e continua)
          git commit -m "🛠️ Auto-gerar itens e receitas completas do mod dentro do BP" || echo "Sem alterações para commitar"
          
          # Puxa as atualizações do remoto aplicando rebase para evitar conflito
          git pull origin main --rebase
          
          # Envia para o GitHub com sucesso
          git push origin main
