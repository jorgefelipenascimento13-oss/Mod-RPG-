name: Gerar Receitas do Mod

on:
  workflow_dispatch: # Permite rodar manualmente pelo site do GitHub na aba Actions

jobs:
  gerar-json-receitas:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite que o GitHub salve os arquivos gerados de volta no repositório
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script Python de receitas
        run: python gerar_receitas.py # Substitua pelo nome do seu arquivo .py se for diferente

      - name: Commitar e enviar os arquivos gerados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📜 Auto-gerar arquivos JSON de receitas via GitHub Actions"
          branch: main # Altere para 'master' se a branch principal do seu repositório for master
          
