name: Gerar Itens do Mod (BP)

on:
  workflow_dispatch: # Permite rodar o script manualmente direto pelo site do GitHub

jobs:
  gerar-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite que a Action salve os arquivos gerados de volta no repositório
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script Python dentro do Behavior Pack
        working-directory: ./BP   # <--- DIRECIONA O SCRIPT PARA A PASTA BP
        run: python gerar_itens.py

      - name: Commitar e enviar os arquivos gerados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-gerar arquivos JSON de itens dentro do Behavior Pack (BP)"
          branch: main # Ajuste para 'master' se a branch principal do seu repo for master
